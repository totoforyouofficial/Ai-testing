<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop Test Lab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.1/dist/umd/supabase.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css" />
<style>
  body { font-family: 'Inter', sans-serif; }
  .tab-btn.active { background-color: #4f46e5; color: white; }
  .card { transition: transform 0.2s ease; }
  .card:hover { transform: translateY(-2px); }
  table th { position: sticky; top: 0; background-color: #f9fafb; z-index: 1; }
  .table-wrap { max-height: 500px; overflow: auto; }
  .loader { border: 3px solid #e5e7eb; border-top: 3px solid #4f46e5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<script>
  const SUPABASE_URL = "https://arvykxqolamslfmuibpe.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MxA2DbmBuGsP0poGMmJF0A_ajbPe4DN";
  
  // Initialize Supabase client correctly
  const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

<header class="bg-white shadow-sm border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-gray-900">🧪 Shop Test Lab</h1>
      <p class="text-xs text-gray-500">Fake data • Safe testing • No real shop info</p>
    </div>
    <div id="status" class="text-xs text-gray-500">Connecting...</div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <section id="dashboard" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
    <div class="card bg-white rounded-xl shadow-sm p-4 border border-gray-100">
      <div class="text-xs text-gray-500 font-medium">Customers</div>
      <div id="card-customers" class="text-2xl font-bold text-indigo-600 mt-1">—</div>
    </div>
    <div class="card bg-white rounded-xl shadow-sm p-4 border border-gray-100">
      <div class="text-xs text-gray-500 font-medium">Total Sales</div>
      <div id="card-sales" class="text-2xl font-bold text-green-600 mt-1">—</div>
    </div>
    <div class="card bg-white rounded-xl shadow-sm p-4 border border-gray-100">
      <div class="text-xs text-gray-500 font-medium">Purchases</div>
      <div id="card-purchases" class="text-2xl font-bold text-orange-600 mt-1">—</div>
    </div>
    <div class="card bg-white rounded-xl shadow-sm p-4 border border-gray-100">
      <div class="text-xs text-gray-500 font-medium">Expenses</div>
      <div id="card-expenses" class="text-2xl font-bold text-red-600 mt-1">—</div>
    </div>
    <div class="card bg-white rounded-xl shadow-sm p-4 border border-gray-100 col-span-2 md:col-span-1">
      <div class="text-xs text-gray-500 font-medium">Profit</div>
      <div id="card-profit" class="text-2xl font-bold text-blue-700 mt-1">—</div>
    </div>
  </section>

  <nav class="flex flex-wrap gap-2 mb-4">
    <button class="tab-btn active px-3 py-1.5 text-sm rounded-lg bg-gray-100 text-gray-700" data-tab="customers">Customers</button>
    <button class="tab-btn px-3 py-1.5 text-sm rounded-lg bg-gray-100 text-gray-700" data-tab="products">Products</button>
    <button class="tab-btn px-3 py-1.5 text-sm rounded-lg bg-gray-100 text-gray-700" data-tab="suppliers">Suppliers</button>
    <button class="tab-btn px-3 py-1.5 text-sm rounded-lg bg-gray-100 text-gray-700" data-tab="invoices">Invoices</button>
    <button class="tab-btn px-3 py-1.5 text-sm rounded-lg bg-gray-100 text-gray-700" data-tab="purchases">Purchases</button>
    <button class="tab-btn px-3 py-1.5 text-sm rounded-lg bg-gray-100 text-gray-700" data-tab="expenses">Expenses</button>
  </nav>

  <div class="mb-4">
    <input id="searchInput" type="text" placeholder="Search in current tab..." class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-sm" />
  </div>

  <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div id="tableContainer" class="table-wrap"></div>
  </section>
  
  <section id="ai-slot" class="mt-8"></section>
</main>

<script>
let currentTab = "customers";
let cache = {};
const fmt = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });

function showStatus(msg, color = "text-gray-500") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "text-xs " + color;
}

async function loadDashboard() {
  try {
    const [cust, sales, purch, exp] = await Promise.all([
      supabase.from("customers").select("id"),
      supabase.from("invoices").select("total_amount").eq("status", "paid"),
      supabase.from("purchases").select("total_cost"),
      supabase.from("expenses").select("amount"),
    ]);
    const totalCustomers = cust.data?.length || 0;
    const totalSales = (sales.data || []).reduce((s, r) => s + Number(r.total_amount), 0);
    const totalPurchases = (purch.data || []).reduce((s, r) => s + Number(r.total_cost), 0);
    const totalExpenses = (exp.data || []).reduce((s, r) => s + Number(r.amount), 0);
    const profit = totalSales - totalPurchases - totalExpenses;

    document.getElementById("card-customers").textContent = totalCustomers;
    document.getElementById("card-sales").textContent = fmt(totalSales);
    document.getElementById("card-purchases").textContent = fmt(totalPurchases);
    document.getElementById("card-expenses").textContent = fmt(totalExpenses);
    const profitEl = document.getElementById("card-profit");
    profitEl.textContent = fmt(profit);
    profitEl.className = "text-2xl font-bold mt-1 " + (profit >= 0 ? "text-blue-700" : "text-red-600");
  } catch (e) { console.error("Dashboard error:", e); }
}

async function loadTable(tab) {
  const container = document.getElementById("tableContainer");
  container.innerHTML = '<div class="p-8 flex justify-center"><div class="loader"></div></div>';

  let query;
  switch (tab) {
    case "customers": query = supabase.from("customers").select("*").order("id"); break;
    case "products": query = supabase.from("products").select("*, suppliers(name)").order("id"); break;
    case "suppliers": query = supabase.from("suppliers").select("*").order("id"); break;
    case "invoices": query = supabase.from("invoices").select("*, customers(name)").order("invoice_date", { ascending: false }); break;
    case "purchases": query = supabase.from("purchases").select("*, suppliers(name), products(name)").order("purchase_date", { ascending: false }); break;
    case "expenses": query = supabase.from("expenses").select("*").order("expense_date", { ascending: false }); break;
  }

  const { data, error } = await query;
  if (error) {
    container.innerHTML = `<div class="p-6 bg-red-50 border border-red-200 rounded-lg m-4">
      <h3 class="text-red-700 font-bold mb-2">Database Error</h3>
      <p class="text-red-600 text-sm font-mono bg-red-100 p-2 rounded">${error.message}</p>
    </div>`;
    return;
  }
  cache[tab] = data || [];
  renderTable(tab, cache[tab]);
}

function renderTable(tab, rows) {
  const container = document.getElementById("tableContainer");
  if (!rows.length) {
    container.innerHTML = '<div class="p-6 text-center text-gray-500 text-sm">No records found.</div>';
    return;
  }
  const flat = rows.map(r => {
    const out = {};
    for (const k in r) {
      if (r[k] && typeof r[k] === "object") {
        for (const sub in r[k]) out[k + "_" + sub] = r[k][sub];
      } else { out[k] = r[k]; }
    }
    return out;
  });
  const cols = Object.keys(flat[0]);
  const html = `<table class="w-full text-sm">
    <thead><tr class="border-b border-gray-200">${cols.map(c => `<th class="text-left px-3 py-2 font-semibold text-gray-600 text-xs uppercase">${c}</th>`).join("")}</tr></thead>
    <tbody>${flat.map(r => `<tr class="border-b border-gray-100 hover:bg-gray-50">${cols.map(c => `<td class="px-3 py-2 text-gray-700 whitespace-nowrap">${r[c] ?? ""}</td>`).join("")}</tr>`).join("")}</tbody>
  </table>`;
  container.innerHTML = html;
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase().trim();
  const rows = cache[currentTab] || [];
  if (!q) { renderTable(currentTab, rows); return; }
  const filtered = rows.filter(r => Object.values(r).some(v => v !== null && v !== undefined && String(v).toLowerCase().includes(q)));
  renderTable(currentTab, filtered);
});

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    document.getElementById("searchInput").value = "";
    loadTable(currentTab);
  });
});

(async function init() {
  showStatus("Loading data...", "text-indigo-600");
  await loadDashboard();
  await loadTable(currentTab);
  showStatus("✓ Connected", "text-green-600");
})();
</script>
</body>
</html>
